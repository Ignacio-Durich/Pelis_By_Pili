# Typecheck, lint y tests de la app en cada push. Los tests de seguridad no corren acá:
# necesitan Supabase (local o el real) y sus claves.
name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
